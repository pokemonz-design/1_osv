<style>
.industry-icons {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin: 14px 0 22px;
    padding-bottom: 44px;
}
.industry-item {
    position: relative;
    width: 74px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    outline: none;
}
.industry-item img {
    width: 74px;
    height: 74px;
    display: block;
    border-radius: 50%;
    border: 2px solid transparent;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}
.industry-item:hover img,
.industry-item:focus img {
    transform: translateY(-2px);
    border-color: #7a3f8f;
    box-shadow: 0 6px 16px rgba(105, 54, 128, 0.18);
}
.industry-tooltip {
    position: absolute;
    top: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%) translateY(-4px);
    min-width: 150px;
    max-width: 220px;
    padding: 7px 10px;
    background: #ffffff;
    color: #6f3b80;
    border: 1px solid #c9b2d2;
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(80, 40, 95, 0.14);
    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 1.3;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 10;
}
.industry-tooltip::before {
    content: "";
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-bottom-color: #c9b2d2;
}
.industry-tooltip::after {
    content: "";
    position: absolute;
    bottom: calc(100% - 1px);
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-bottom-color: #ffffff;
}
.industry-item:hover .industry-tooltip,
.industry-item:focus .industry-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}
@media (max-width: 600px) {
    .industry-icons {
        gap: 10px;
        padding-bottom: 40px;
    }
    .industry-item {
        width: 64px;
    }
    .industry-item img {
        width: 64px;
        height: 64px;
    }
    .industry-tooltip {
        min-width: 130px;
        max-width: 190px;
        font-size: 12px;
    }
}
</style>

<div class="industry-icons">
    <div class="industry-item" tabindex="0">
        <img src="images/opt.png" alt="Оптовая торговля">
        <div class="industry-tooltip">Оптовая торговля</div>
    </div>
    <div class="industry-item" tabindex="0">
        <img src="images/roznica.png" alt="Розничные сети">
        <div class="industry-tooltip">Розничные сети</div>
    </div>
    <div class="industry-item" tabindex="0">
        <img src="images/proizv.png" alt="Производство">
        <div class="industry-tooltip">Производство</div>
    </div>
    <div class="industry-item" tabindex="0">
        <img src="images/agro.png" alt="Агробизнес">
        <div class="industry-tooltip">Агробизнес</div>
    </div>
</div>
